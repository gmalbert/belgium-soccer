name: Belgian Pro League artifact pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: belgium-artifact-pipeline
  cancel-in-progress: false

jobs:
  build-and-validate:
    uses: gmalbert/pitch-oracle-core/.github/workflows/precompute-consumer.yml@9042f6a58d2c8b8ea6de8e5d3ec7b03f518299ef
    with:
      core_ref: 9042f6a58d2c8b8ea6de8e5d3ec7b03f518299ef
      league_key: belgium
      data_command: >-
        python -m combine_raw_data &&
        python -m fetch_upcoming_fixtures &&
        python -m prepare_model_data
      training_command: python -m train_models
      prediction_command: python scripts/precompute_predictions.py
    secrets: inherit
