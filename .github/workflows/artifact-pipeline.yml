name: Belgian Pro League artifact pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"

permissions:
  contents: write

concurrency:
  group: belgium-artifact-pipeline
  cancel-in-progress: false

jobs:
  build-and-validate:
    uses: gmalbert/pitch-oracle-core/.github/workflows/precompute-consumer.yml@bf957d033d2094df6d997ecc21d88ec3b66e94a3
    with:
      core_ref: bf957d033d2094df6d997ecc21d88ec3b66e94a3
      league_key: belgium
      data_command: >-
        python -m combine_raw_data &&
        python -m fetch_upcoming_fixtures &&
        python -m prepare_model_data
      training_command: python -m train_models
      prediction_command: python scripts/precompute_predictions.py
    secrets: inherit
